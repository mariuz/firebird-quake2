name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The demo's pak0.pak sits inside the self-extracting q2-314-demo-x86.exe (a zip)
      - name: Cache the demo pak
        id: pak
        uses: actions/cache@v4
        with:
          path: public/pak/
          key: q2-314-demo-${{ hashFiles('scripts/fetch-pak.mjs') }}

      - name: Fetch the demo pak
        if: steps.pak.outputs.cache-hit != 'true'
        run: npm run fetch-pak

      # Runs the game's SQL inside the real Firebird WASM engine under Node:
      # loads the Outer Base, walks, shoots, opens a door, renders frames.
      - name: SQL smoke test (demo1)
        run: npm test

      - name: SQL smoke test (demo2)
        run: npm run test:base2

      - name: The same on demo3 (its func_water, its own crosslevel trigger)
        run: npm run test:base3

      # Every monster of the demo: spawned in front of the player, they see, chase, shoot and die
      - name: The monsters
        run: npm run test:monsters

      # Every trigger a player can walk into, on each demo map: it fires, and the movers it targets move
      - name: The triggers
        run: npm run test:walkthrough

      # The full game's entities the demo maps lack, added to demo1: secret doors, the earthquake, the
      # elevator, the viper and its bomb, the ships' flybys, the string display and the clock, the decorations, a turret, target_spawner
      - name: The full game's entities
        run: npm run test:entities

      # Save, play on, load: the game comes back exactly and keeps running
      - name: Saved games
        run: npm run test:save

      # The menus: keys, slots, settings, pictures
      - name: The menus
        run: npm run test:menu

      # The painter: dynamic lights, mip levels
      - name: The painter
        run: npm run test:painter

      # The same seed and the same inputs give the same game, twice; another seed does not
      - name: Replays
        run: npm run test:replay

      # A gamepad read as Quake's usercmd: dead zones, the run, a press once, the menu keys
      - name: Gamepad input
        run: npm run test:input

      # The console line headless: the page's commands, player_command, the history, Tab
      - name: The console
        run: npm run test:console

      # The settings: defaults, the storage round trip, bad stored values back to their defaults
      - name: The settings
        run: npm run test:settings

      # The game as the page plays it, without the page (src/session.js): tics, the frame decoded in
      # both renderer modes, slots saved and loaded, levels left and come back to, a unit's end
      - name: The session
        run: npm run test:session

      # The temporary entities headless: explosions, beams, the tongue, flashes, a gunshot's smoke and flash, their lights
      # and drawing; then the game's own: the water explosions, the ricochets, the BFG's lasers, sparks, strike and sprite
      - name: The effects
        run: npm run test:effects

      # The sound mix headless: spatialisation, one-shots cut per channel, loops summed per sound, speakers, music
      - name: The sound mix
        run: npm run test:audio

      # A coop game headless: two clients, their usercmds, rows and views, the monsters' sight client, respawns,
      # the weapons and keys that stay, a level change and a save with both; single player untouched
      - name: Coop
        run: npm run test:coop

      # A game shared over a link, headless (src/net.js over a loopback): the guest's commands merged into the
      # second client's usercmd, its frames sent with the tic's sounds, the map and a level change, the chunks,
      # a slow link's dropped frames, the signalling texts
      - name: A game over the network
        run: npm run test:net

      # A deathmatch headless: the spots, no monsters, the deathmatch items and their respawns, weapons that stay,
      # the frags, the respawn afresh, the exit that kills, the frag and time limits, the dmflags, a save and a level change
      - name: Deathmatch
        run: npm run test:dm

      # The pak's demo read and played headless (src/demo.js): every block consumed exactly, the frames, the view
      # and the entities lerped, the events once, the sounds and flashes, the session's demo frame, a frame painted
      - name: Demo playback
        run: npm run test:demo

      # The frames between tics (src/lerp.js): the eye and the entities moved between two tics' frames by the
      # fraction, snaps, the brush models, the input's turn immediate, and the same halfway between two tics of a game
      - name: Frames between tics
        run: npm run test:lerp

      # The figures held: the load of demo1, an idle and a walking tic, the frame query and the raster, each in
      # units of a calibration run on this runner (the engine's PK fetches, a JS loop) against docs/perf-baseline.json;
      # a figure past twice its baseline fails (the runner's noise is well under that; a slip like 17 ms a tic is not)
      - name: Performance guard
        run: npm run perf

      # The page itself in a headless Chromium, served without COOP/COEP as Pages serves it: the
      # engine's build without threads, the pak downloads, Firebird runs in its worker, keys, a
      # quick save and load, the menu, a coop game and a deathmatch from the players select, the pak's demo
      # played from the select and stopped by a key, a second page
      # joining the first's game over WebRTC with the texts passed between them, the caching service worker
      # registered with the build's files and the pak in its caches and the page reloaded offline, the retired
      # service worker removing itself, no console errors. Then the same with the headers, on the threaded build.
      - name: Install Chromium for the browser test
        run: npx playwright install --with-deps chromium

      - name: The page in a browser
        run: npm run test:browser

      - name: The page in a browser, cross-origin isolated (the threaded build)
        run: npm run test:browser -- --coi

      # The painter's look: the twelve docs screenshots rendered again and compared pixel for pixel
      - name: The docs screenshots, pixel for pixel
        run: npm run test:golden

      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
